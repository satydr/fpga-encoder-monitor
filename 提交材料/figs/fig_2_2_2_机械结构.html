<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#fff}svg{display:block}text{font-family:'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif}</style>
</head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <text x="40" y="38" font-size="22" font-weight="bold" fill="#1f3a5f">图 2.2.2　机械结构示意图（侧视）</text>
  <g transform="translate(0,-140)">
    <!-- 底板 -->
    <rect x="100" y="560" width="800" height="30" fill="#e8edf3" stroke="#1f3a5f" stroke-width="2"/>
    <text x="500" y="580" font-size="15" fill="#1f3a5f" text-anchor="middle">底板（亚克力 / 铝板，打孔固定）</text>
    <circle cx="140" cy="575" r="6" fill="#fff" stroke="#1f3a5f" stroke-width="1.5"/>
    <circle cx="340" cy="575" r="6" fill="#fff" stroke="#1f3a5f" stroke-width="1.5"/>
    <circle cx="660" cy="575" r="6" fill="#fff" stroke="#1f3a5f" stroke-width="1.5"/>
    <circle cx="860" cy="575" r="6" fill="#fff" stroke="#1f3a5f" stroke-width="1.5"/>

    <!-- 减震垫 -->
    <rect x="205" y="540" width="50" height="20" fill="#9fb3c8" stroke="#1f3a5f" stroke-width="1.5"/>
    <rect x="300" y="540" width="50" height="20" fill="#9fb3c8" stroke="#1f3a5f" stroke-width="1.5"/>
    <text x="278" y="554" font-size="12.5" font-weight="bold" fill="#1f3a5f" text-anchor="middle">减震垫</text>

    <!-- 电机 -->
    <rect x="170" y="360" width="210" height="180" rx="10" fill="#dde7f2" stroke="#1f3a5f" stroke-width="2.5"/>
    <text x="275" y="432" font-size="16" font-weight="bold" fill="#1f3a5f" text-anchor="middle">直流减速电机</text>
    <text x="275" y="458" font-size="15" fill="#1f3a5f" text-anchor="middle">JGB37-520</text>
    <line x1="380" y1="450" x2="445" y2="450" stroke="#1f3a5f" stroke-width="7"/>
    <path d="M398 420 a30 30 0 0 1 0 60" fill="none" stroke="#e8833a" stroke-width="2.5"/>
    <text x="404" y="412" font-size="13" fill="#e8833a">旋转方向</text>

    <!-- 联轴器 -->
    <rect x="440" y="436" width="72" height="28" rx="5" fill="#cdd9ea" stroke="#1f3a5f" stroke-width="2.5"/>
    <text x="476" y="492" font-size="14" fill="#1f3a5f" text-anchor="middle">联轴器</text>

    <!-- 编码器 -->
    <rect x="512" y="386" width="190" height="128" rx="10" fill="#dde7f2" stroke="#1f3a5f" stroke-width="2.5"/>
    <text x="607" y="448" font-size="16" font-weight="bold" fill="#1f3a5f" text-anchor="middle">增量式编码器</text>
    <text x="607" y="474" font-size="14" fill="#1f3a5f" text-anchor="middle">（同轴法兰安装）</text>

    <!-- 同轴中心线 -->
    <line x1="120" y1="450" x2="900" y2="450" stroke="#e8833a" stroke-width="1.5" stroke-dasharray="9 6"/>
    <text x="712" y="442" font-size="13" fill="#e8833a">← 同轴中心线（保证同心度）→</text>

    <!-- 信号线 A/B/Z -->
    <path d="M607 386 L607 300 L800 300" fill="none" stroke="#1f3a5f" stroke-width="2"/>
    <polygon points="800,300 790,295 790,305" fill="#1f3a5f"/>
    <text x="612" y="292" font-size="14" fill="#1f3a5f">A/B/Z 信号 → J5 扩展口（B11 / A11 / E15）</text>

    <!-- 供电说明 -->
    <text x="170" y="648" font-size="13" fill="#1f3a5f">编码器供电 DC 5V（外部适配器）</text>

    <!-- 要点框 -->
    <rect x="470" y="624" width="430" height="44" rx="6" fill="#fff6e5" stroke="#e8833a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="485" y="644" font-size="12.5" fill="#9a5a10">要点：电机—联轴器—编码器同轴固定保证同心度；</text>
    <text x="485" y="662" font-size="12.5" fill="#9a5a10">底板打孔 + 减震垫抑制高速机械共振。</text>
  </g>
</svg>
</body></html>
